services:
  postgres:
    image: postgres:16
    container_name: nx_agent_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nx_agent_kb}
      POSTGRES_USER: ${POSTGRES_USER:-nx_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nx_agent_pass}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - nx_agent_pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  nx_agent_pgdata:
